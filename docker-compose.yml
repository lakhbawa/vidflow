services:
  vidflow-frontend:
    image: node:20-alpine
    working_dir: /app
    command: npm run dev
    volumes:
      - ./next-frontend:/app
    ports:
      - "4800:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4880
    networks: [vidflow-network]

  vidflow-api:
    build:
      context: ./python-api
      dockerfile: Dockerfile.dev
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./python-api:/usr/src/app
      - ./media:/usr/src/app/media
    depends_on:
      - vidflow-redis
      - vidflow-db
    networks: [vidflow-network]

  vidflow-worker:
    build:
      context: ./go-worker
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    volumes:
      - ./go-worker:/app
      - ./media:/app/media
    command: go run cmd/api/main.go
    depends_on:
      - vidflow-redis
      - vidflow-db
    networks: [vidflow-network]

  tyk-gateway:
    image: tykio/tyk-gateway:v5.6
    ports:
      - "4880:8080"
    environment:
      - TYK_GW_STORAGE_HOST=vidflow-redis
      - TYK_GW_STORAGE_PORT=6379
      - TYK_GW_SECRET=352d20ee67be67f6340b4c0605b044b7
      - TYK_GW_LOGLEVEL=info
    volumes:
      - ./docker/tyk/tyk.conf:/opt/tyk-gateway/tyk.conf
      - ./docker/tyk/apps:/opt/tyk-gateway/apps
      - ./docker/tyk/policies:/opt/tyk-gateway/policies
      - ./docker/tyk/middleware:/opt/tyk-gateway/middleware
    depends_on:
      - vidflow-redis
    networks: [vidflow-network]

  tyk-dashboard:
    image: tykio/tyk-dashboard:v5.6
    ports:
      - "4801:3000"
    environment:
      - TYK_DB_LISTENPORT=3000
      - TYK_DB_TYKAPI_HOST=http://tyk-gateway
      - TYK_DB_TYKAPI_PORT=8080
      - TYK_DB_REDISHOST=vidflow-redis
      - TYK_DB_REDISPORT=6379
      - TYK_DB_STORAGE_MAIN_TYPE=postgres
      - TYK_DB_STORAGE_MAIN_CONNECTIONSTRING=user=postgres password=postgres host=tyk-postgres port=5432 database=tyk_analytics sslmode=disable
      - TYK_DB_ADMINSECRET=12345
      - TYK_DB_NODESECRET=352d20ee67be67f6340b4c0605b044b7
      - TYK_IB_SESSION_SECRET=changeme123
    depends_on:
      tyk-postgres:
        condition: service_healthy
      tyk-gateway:
        condition: service_started
    networks: [vidflow-network]

  tyk-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=tyk_analytics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"  # Different port to avoid conflict with vidflow-db
    volumes:
      - tyk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [vidflow-network]

  vidflow-redis:
    image: redis:7-alpine
    ports:
      - "4809:6379"
    volumes:
      - redisdata:/data
    networks: [vidflow-network]

  vidflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vidflow
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [vidflow-network]

  vidflow-adminer:
    image: adminer:latest
    ports:
      - "4881:8080"
    depends_on:
      - vidflow-db
    networks: [vidflow-network]

volumes:
  db_data:
  redisdata:
  tyk-postgres-data:

networks:
  vidflow-network:
    driver: bridge